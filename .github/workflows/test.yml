name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bot/package-lock.json

      # The bot reads config.json (not committed on purpose). The tests only
      # need defaultTheme, so a copy of the example file is enough.
      - name: Create config.json
        run: cp config.example.json config.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
